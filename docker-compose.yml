services:

  # ============================================================
  # PostgreSQL
  # ============================================================
  postgres:
    image: postgres:18.4-alpine

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nexus}
      POSTGRES_USER: ${POSTGRES_USER:-nexus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nexus_dev_password}

    # IMPORTANT:
    # Do NOT expose 5432 to Windows.
    # Backend communicates with PostgreSQL internally using:
    # postgres:5432

    volumes:
      - postgres_data:/var/lib/postgresql

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-nexus} -d ${POSTGRES_DB:-nexus}"
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

    restart: unless-stopped


  # ============================================================
  # Redis
  # ============================================================
  redis:
    image: redis:7.4-alpine

    command:
      redis-server --appendonly yes

    ports:
      - "6379:6379"

    volumes:
      - redis_data:/data

    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "ping"
        ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

    restart: unless-stopped


  # ============================================================
  # Qdrant Vector Database
  # ============================================================
  qdrant:
    image: qdrant/qdrant:latest

    ports:
      - "6333:6333"
      - "6334:6334"

    volumes:
      - qdrant_data:/qdrant/storage

    restart: unless-stopped


  # ============================================================
  # Apache Kafka - KRaft Mode
  # ============================================================
  kafka:
    image: apache/kafka:4.3.1

    ports:
      - "9092:9092"

    environment:
      KAFKA_NODE_ID: 1

      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:29093,PLAINTEXT_HOST://:9092

      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1

      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"
        ]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

    restart: unless-stopped


  # ============================================================
  # FastAPI Backend
  # ============================================================
  backend:
    build:
      context: ./backend

    environment:

      # PostgreSQL
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://nexus:nexus_dev_password@postgres:5432/nexus}

      # Redis
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}

      # Kafka
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:29092}

      KAFKA_TOPIC: ${KAFKA_TOPIC:-nexus.interactions.v1}

      # Qdrant
      QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}

      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-nexus_movies}

      # Embeddings
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-BAAI/bge-small-en}

      # Frontend CORS
      CORS_ORIGINS: http://localhost:3000

      # TMDB
      TMDB_BEARER_TOKEN: ${TMDB_BEARER_TOKEN:-}

      TMDB_TELUGU_PAGES: ${TMDB_TELUGU_PAGES:-15}

      TMDB_IMAGE_BASE_URL: ${TMDB_IMAGE_BASE_URL:-https://image.tmdb.org/t/p/w500}

    ports:
      - "8000:8000"

    volumes:
      - model_artifacts:/app/artifacts
      - embedding_cache:/root/.cache

    depends_on:

      postgres:
        condition: service_healthy

      redis:
        condition: service_healthy

      kafka:
        condition: service_healthy

      qdrant:
        condition: service_started

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

    restart: unless-stopped


  # ============================================================
  # Kafka Event Consumer
  # ============================================================
  event-consumer:
    build:
      context: ./backend

    command:
      python -m app.streaming.consumer

    environment:

      # PostgreSQL
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://nexus:nexus_dev_password@postgres:5432/nexus}

      # Redis
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}

      # Kafka
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:29092}

      KAFKA_TOPIC: ${KAFKA_TOPIC:-nexus.interactions.v1}

      # Qdrant
      QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}

      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-nexus_movies}

      # Embeddings
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-BAAI/bge-small-en}

      # TMDB
      TMDB_BEARER_TOKEN: ${TMDB_BEARER_TOKEN:-}

      TMDB_TELUGU_PAGES: ${TMDB_TELUGU_PAGES:-15}

      TMDB_IMAGE_BASE_URL: ${TMDB_IMAGE_BASE_URL:-https://image.tmdb.org/t/p/w500}

    volumes:
      - model_artifacts:/app/artifacts
      - embedding_cache:/root/.cache

    depends_on:

      postgres:
        condition: service_healthy

      redis:
        condition: service_healthy

      kafka:
        condition: service_healthy

      qdrant:
        condition: service_started

      backend:
        condition: service_healthy

    restart: unless-stopped


  # ============================================================
  # Next.js Frontend
  # ============================================================
  frontend:
    build:
      context: ./frontend

    environment:

      # Used by Next.js server-side requests
      INTERNAL_API_URL: http://backend:8000/api/v1

      # Used by browser requests
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1

    ports:
      - "3000:3000"

    depends_on:

      backend:
        condition: service_healthy

    restart: unless-stopped


# ==============================================================
# Persistent Docker Volumes
# ==============================================================
volumes:

  postgres_data:

  redis_data:

  qdrant_data:

  model_artifacts:

  embedding_cache: